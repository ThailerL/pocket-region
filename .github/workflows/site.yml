# Publishes the site/ Astro site to Cloudflare Workers. The library's dist/ and vendor/ are gitignored
# and rebuilt here, then copied into the site, so it always demonstrates the commit it was built from.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A queued run deploys the newer commit; cancelling mid-deploy would leave the site half-updated
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # Needs the network: the wheels come from PyPI and Pyodide's distribution
      - run: npm run vendor
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      # Before the tests: they import site/src/runnable/session.ts, whose tsconfig extends Astro's
      - run: npm ci --prefix site
      # Pyodide cold starts compete for the runner's 4 cores
      - run: npm test -- --maxWorkers=2
      - run: npm run check --prefix site
      - run: npm run build --prefix site
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: 4.135.0
