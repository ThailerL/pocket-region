# Publishes the site/ Astro site to GitHub Pages. The library's dist/ and vendor/ are gitignored
# and rebuilt here, then copied into the site, so it always demonstrates the commit it was built from.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run deploys the newer commit; cancelling mid-deploy would leave Pages half-updated
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # Needs the network: the wheels come from PyPI and Pyodide's distribution
      - run: npm run vendor
      - run: npm run build
      - run: npm test
      - run: npm ci --prefix site
      - run: npm run check --prefix site
      # site/public/CNAME is in the artifact; without it, a deploy clears the custom domain
      - run: npm run build --prefix site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
