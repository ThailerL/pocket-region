# Publishes demo/index.html to GitHub Pages with the dist/ and vendor/ it needs. Both are
# gitignored and rebuilt here, so the page always demonstrates the commit it was built from.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run deploys the newer commit; cancelling mid-deploy would leave Pages half-updated
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Needs the network: the wheels come from PyPI and Pyodide's distribution
      - run: npm run vendor
      - run: npm run build
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp demo/index.html _site/
          cp -r dist vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
