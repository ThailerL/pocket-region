<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Region in a page</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 15%, transparent);
        --faint: color-mix(in srgb, currentColor 60%, transparent);
      }
      body {
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        max-width: 52rem;
        font: 16px/1.5 system-ui, sans-serif;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      p.lede {
        margin-top: 0;
        color: var(--faint);
      }
      button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .terminal {
        margin-top: 1.5rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        overflow: hidden;
      }
      #log {
        margin: 0;
        padding: 1rem;
        min-height: 16rem;
        max-height: 28rem;
        overflow-y: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.875rem;
      }
      #log .typed {
        font-weight: 600;
      }
      #log .failed {
        color: color-mix(in srgb, red 65%, currentColor);
      }
      form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        border-top: 1px solid var(--line);
        font-family: ui-monospace, monospace;
      }
      form span {
        color: var(--faint);
      }
      input {
        flex: 1;
        font: inherit;
        border: 0;
        background: transparent;
        color: inherit;
        outline: none;
      }
      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 1rem;
      }
      .examples button {
        font-family: ui-monospace, monospace;
        font-size: 0.8125rem;
        padding: 0.25rem 0.6rem;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "pocket-region/browser": "./dist/browser.js",
          "pocket-region/cli": "./dist/cli/index.js",
          "pocket-region/sdk": "./dist/request-handler.js",
          "pyodide": "https://cdn.jsdelivr.net/npm/pyodide@314.0.6/pyodide.mjs",
          "@aws-sdk/client-s3": "https://cdn.jsdelivr.net/npm/@aws-sdk/client-s3@3.1131.0/+esm",
          "@aws-sdk/client-sqs": "https://cdn.jsdelivr.net/npm/@aws-sdk/client-sqs@3.1131.0/+esm",
          "@aws-sdk/client-sns": "https://cdn.jsdelivr.net/npm/@aws-sdk/client-sns@3.1131.0/+esm",
          "@aws-sdk/client-dynamodb": "https://cdn.jsdelivr.net/npm/@aws-sdk/client-dynamodb@3.1131.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <h1>Pocket Region in a page</h1>
    <p class="lede">
      Real S3, SQS and DynamoDB, running in this tab. Type AWS CLI commands below: no server
      answers them, and nothing leaves your browser.
    </p>

    <div class="terminal">
      <pre id="log"><code>booting: fetching the runtime from jsDelivr and the wheels from ./vendor…
</code></pre>
      <form id="prompt">
        <span>$ aws</span>
        <input id="command" autocomplete="off" spellcheck="false" placeholder="s3 ls" disabled />
      </form>
    </div>

    <div class="examples" id="examples"></div>
    <div class="examples" id="status"></div>

    <script type="module">
      import { createRegion } from 'pocket-region/browser';
      import { awsCli } from 'pocket-region/cli';

      const log = document.querySelector('#log code');
      const prompt = document.querySelector('#prompt');
      const status = document.querySelector('#status');
      const command = document.querySelector('#command');
      const examples = document.querySelector('#examples');

      const EXAMPLES = [
        's3 mb s3://notes',
        's3api put-object --bucket notes --key hello.txt --body "written in a tab"',
        's3 ls s3://notes',
        's3api get-object --bucket notes --key hello.txt',
        'sqs create-queue --queue-name orders',
        'dynamodb list-tables',
        'sns create-topic --name alerts',
        'help',
      ];

      let aws;

      function write(text, className) {
        const line = document.createElement('span');
        if (className) line.className = className;
        line.textContent = text;
        log.append(line);
        log.parentElement.scrollTop = log.parentElement.scrollHeight;
      }

      async function run(line) {
        if (!aws || !line.trim()) return;
        command.value = '';
        write(`\n$ aws ${line}\n`, 'typed');
        const { stdout, stderr, code } = await aws(line);
        if (stdout) write(stdout);
        if (stderr) write(stderr, 'failed');
        if (!stdout && !stderr) write(`(exit ${code})\n`);
      }

      for (const example of EXAMPLES) {
        const button = document.createElement('button');
        button.textContent = example.length > 44 ? `${example.slice(0, 43)}…` : example;
        button.title = example;
        button.addEventListener('click', () => run(example));
        examples.append(button);
      }

      prompt.addEventListener('submit', (event) => {
        event.preventDefault();
        run(command.value);
      });

      async function bootRegion() {
        status.replaceChildren();
        try {
          const started = performance.now();
          // Relative, so this works under a project subpath as well as at the root
          const region = await createRegion({ assetsBaseUrl: './vendor' });
          aws = awsCli(region);
          write(`ready in ${Math.round(performance.now() - started)} ms. Try a command.\n`);
          for (const button of examples.children) button.disabled = false;
          command.disabled = false;
          command.focus();
        } catch (error) {
          write(`failed to boot: ${error.message}\n`, 'failed');
          const retry = document.createElement('button');
          retry.textContent = 'Try again';
          retry.addEventListener('click', bootRegion);
          status.append(retry);
        }
      }

      bootRegion();
    </script>
  </body>
</html>
